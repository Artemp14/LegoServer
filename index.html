<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #e11d48;
            z-index: 10;
        }
        header h1 { font-size: 1.5rem; letter-spacing: 1px; font-weight: 800; text-transform: uppercase; }
        header h1 span { color: #f59e0b; }
        .controls { display: flex; gap: 15px; }
        button {
            background: #e11d48; color: white; border: none; padding: 8px 16px;
            font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #be123c; transform: translateY(-1px); }
        button.clear { background: #4b5563; }
        button.clear:hover { background: #374151; }
        #viewport {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #7dd3fc, #bae6fd);
            overflow: hidden;
            perspective: 1000px;
        }
        .beach-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 55%;
            background: linear-gradient(to bottom, #4fc3f7 0%, #81d4fa 40%, #ffb74d 45%, #ffe082 50%, #00acc1 50%, #00838f 75%, #ffe082 75%, #ffcc80 100%);
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.1);
        }
        .sun {
            position: absolute;
            top: 15%; left: 75%; width: 90px; height: 90px;
            background: #fff9c4; border-radius: 50%;
            box-shadow: 0 0 40px #fffde7;
        }
        .countertop {
            position: absolute;
            bottom: 0; left: -10%; width: 120%; height: 50%;
            background: linear-gradient(135deg, #e5e7eb, #d1d5db);
            border-top: 4px solid #9ca3af;
            transform: rotateX(25deg);
            transform-origin: bottom center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
        }
        #sandbox {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }
        .brick {
            position: absolute;
            width: 96px; height: 48px;
            cursor: grab;
            transform-style: preserve-3d;
            transition: box-shadow 0.1s;
        }
        .brick:active { cursor: grabbing; }
        .face { position: absolute; box-sizing: border-box; }
        .front  { width: 96px; height: 35px; transform: translateZ(24px); filter: brightness(1); }
        .back   { width: 96px; height: 35px; transform: rotateY(180deg) translateZ(24px); filter: brightness(0.8); }
        .top    { width: 96px; height: 48px; transform: rotateX(90deg) translateZ(24px); filter: brightness(1.2); display: flex; flex-wrap: wrap; padding: 2px; align-content: space-around; justify-content: space-around;}
        .left   { width: 48px; height: 35px; transform: rotateY(-90deg) translateZ(24px); filter: brightness(0.7); }
        .right  { width: 48px; height: 35px; transform: rotateY(90deg) translateZ(72px); filter: brightness(0.9); }
        .stud {
            width: 16px; height: 16px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.6), inset -1px -1px 3px rgba(0,0,0,0.4);
        }
        .red .face    { background: #dc2626; border: 1px solid #b91c1c; }
        .blue .face   { background: #2563eb; border: 1px solid #1d4ed8; }
        .yellow .face { background: #f59e0b; border: 1px solid #d97706; }
        .green .face  { background: #16a34a; border: 1px solid #15803d; }
    </style>
</head>
<body>
    <header>
        <h1>Lego <span>Simulator</span></h1>
        <div class="controls">
            <button onclick="spawnBrick('red')">+ Red Brick</button>
            <button onclick="spawnBrick('blue')">+ Blue Brick</button>
            <button onclick="spawnBrick('yellow')">+ Yellow Brick</button>
            <button onclick="spawnBrick('green')">+ Green Brick</button>
            <button class="clear" onclick="clearSandbox()">Clear Counter</button>
        </div>
    </header>
    <div id="viewport">
        <div class="beach-view"><div class="sun"></div></div>
        <div class="countertop"></div>
        <div id="sandbox"></div>
    </div>
    <script>
        const sandbox = document.getElementById('sandbox');
        let activeBrick = null;
        let offsetX = 0;
        let offsetY = 0;
        const SNAP_X = 24; 
        const SNAP_Y = 12;
        function spawnBrick(color) {
            const brick = document.createElement('div');
            brick.className = `brick ${color}`;
            const faces = ['front', 'back', 'top', 'left', 'right'];
            faces.forEach(f => {
                const face = document.createElement('div');
                face.className = `face ${f}`;
                if (f === 'top') {
                    for(let i=0; i<8; i++) {
                        const stud = document.createElement('div');
                        stud.className = 'stud';
                        face.appendChild(stud);
                    }
                }
                brick.appendChild(face);
            });
            brick.style.left = '150px';
            brick.style.top = '400px';
            brick.addEventListener('mousedown', startDrag);
            brick.addEventListener('touchstart', startDrag, { passive: false });
            sandbox.appendChild(brick);
        }
        function startDrag(e) {
            e.preventDefault();
            activeBrick = e.currentTarget;
            sandbox.appendChild(activeBrick);
            const clientX = e.type.startsWith('touch') ? e.touches.clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches.clientY : e.clientY;
            offsetX = clientX - activeBrick.offsetLeft;
            offsetY = clientY - activeBrick.offsetTop;
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }
        function drag(e) {
            if (!activeBrick) return;
            e.preventDefault();
            const clientX = e.type.startsWith('touch') ? e.touches.clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches.clientY : e.clientY;
            let x = clientX - offsetX;
            let y = clientY - offsetY;
            const minTop = window.innerHeight * 0.45;
            const maxTop = window.innerHeight - 80;
            if (y < minTop) y = minTop;
            if (y > maxTop) y = maxTop;
            x = Math.round(x / SNAP_X) * SNAP_X;
            y = Math.round(y / SNAP_Y) * SNAP_Y;
            activeBrick.style.left = `${x}px`;
            activeBrick.style.top = `${y}px`;
        }
        function stopDrag() {
            activeBrick = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
        }
        function clearSandbox() {
            sandbox.innerHTML = '';
        }
        window.onload = () => {
            spawnBrick('red');
            setTimeout(() => spawnBrick('blue'), 100);
            setTimeout(() => spawnBrick('yellow'), 200);
        };
    </script>
</body>
</html>
